# databases.yml
# Optional database connections for storing bounties and player stats.
# You can connect to as many databases as you want. You could have 5 mySQL databases and 3 redis if you really wanted.

# The time in seconds between connection attempts of the database - set to 0 to disable
auto-connect-interval: 0
# Maximum number of entries for the local cache.
# Increasing this may make the plugin faster but use more ram.
# A recommended value is the peak online player count of your server.
max-local-cache-size: 200
# The time in seconds that data is valid locally after retrieving.
# Set to 0 to always request data from the database.
refresh-interval: 30
local-databse:
  type: SQL
  path: 'data/local.db'
  url: 'jdbc:sqlite:{path}'
# You can change 'example-sql' to a different name if it helps you keep track of it
example-sql:
  # The type of database: SQL, REDIS, or PROXY
  type: SQL
  # All the regular database options
  host: localhost
  port: 3306
  database: db # SQL specific: name of the database
  user: username
  password: pass
  ssl: false
  url: 'jdbc:mysql://{host}:{port}/{database}?useSSL={ssl}&allowMultiQueries=true'
  # Higher priority means that this database will be used more. Your most stable database should be the lowest priority.
  priority: 1
# The redis config is very similar to SQL
example-redis:
  type: REDIS
  host: localhost
  port: 3306
  user: username
  password: pass
  database: 1
  url: 'jdbc:redis://{host}:{port}/{database}'
  # higher priority means that this database will be used more
  priority: 2
example-proxy:
  type: PROXY
  # Whether proxy messaging is enabled.
  enabled: false
  # Whether bounties and player stats will be synchronized with other servers connected to the proxy.
  database-sync: true
  # Whether skins can be obtained from the proxy. This is mainly used for SkinsRestorer
  skins: true
  priority: 3